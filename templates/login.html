<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestor de Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fondo cinematográfico para mantener estética en todo el sistema */
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(126, 34, 206, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(79, 70, 229, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen px-4 selection:bg-purple-500 selection:text-white">

    <!-- Efecto de luz ambiental detrás del cuadro de login -->
    <div class="absolute w-[350px] h-[350px] bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="bg-slate-900/80 backdrop-blur-2xl p-8 rounded-3xl shadow-2xl w-full max-w-md text-white border border-white/10 relative z-10 shadow-purple-950/50">
        <div class="text-center mb-6">
            <div class="inline-flex w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 items-center justify-center shadow-lg shadow-purple-900/50 text-xl mb-3">
                🎬
            </div>
            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-200 via-purple-400 to-pink-400 tracking-wide">Gestor de Streaming</h2>
            <p class="text-xs text-slate-400 mt-1">Ingresa tus credenciales de administrador</p>
        </div>

        <!-- Alerta de error integrada (Solo aparece si las credenciales son incorrectas) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs flex items-center gap-2 tracking-wide">
                <span class="text-base">⚠️</span>
                <span>{{ message }}</span>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium mb-2 text-slate-300 uppercase tracking-wider">Usuario</label>
                <input type="text" name="username" placeholder="Tu usuario" autocomplete="username" class="w-full px-4 py-3.5 bg-slate-950/60 rounded-xl border border-white/10 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-white text-sm transition" required>
            </div>
            
            <div>
                <label class="block text-xs font-medium mb-2 text-slate-300 uppercase tracking-wider">Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" class="w-full px-4 py-3.5 bg-slate-950/60 rounded-xl border border-white/10 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-white text-sm transition" required>
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 py-3.5 rounded-xl font-semibold transition duration-200 shadow-lg shadow-purple-900/50 border border-purple-400/20 text-sm tracking-wide mt-2">Ingresar al Panel</button>
        </form>
    </div>

</body>
</html>
