<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestor de Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="flex items-center justify-center h-screen px-4 selection:bg-indigo-500 selection:text-white">

    <div class="bg-slate-900/90 border border-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-slate-100 relative z-10">
        <div class="text-center mb-6">
            <div class="inline-flex w-10 h-10 rounded-xl bg-indigo-600 items-center justify-center text-lg mb-3 shadow-md">
                📊
            </div>
            <h2 class="text-xl font-bold text-slate-200 tracking-wide">Streaming Corp</h2>
            <p class="text-xs text-slate-400 mt-1">Credenciales de acceso administrativo</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-5 p-3 rounded-lg bg-red-950/40 border border-red-900/50 text-red-300 text-xs flex items-center gap-2">
                <span>⚠️</span>
                <span>{{ message }}</span>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium mb-1.5 text-slate-400 uppercase tracking-wider">Usuario</label>
                <input type="text" name="username" placeholder="Usuario" class="w-full px-3.5 py-3 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-indigo-500 text-slate-200 text-sm" required>
            </div>
            
            <div>
                <label class="block text-xs font-medium mb-1.5 text-slate-400 uppercase tracking-wider">Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" class="w-full px-3.5 py-3 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-indigo-500 text-slate-200 text-sm" required>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-medium transition duration-150 text-sm text-white shadow-sm mt-2">Ingresar al Panel</button>
        </form>
    </div>

</body>
</html>
